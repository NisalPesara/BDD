; Optional PlatformIO setup (Arduino IDE users: just open ppg_esp32.ino).
; The sketch folder itself is the source folder; test/ and tools/ are excluded from the firmware build.
[platformio]
src_dir = .
default_envs = esp32dev   ; matches the current wiring in config.h (SDA 22, SCL 23)

[env]
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<ppg_esp32.ino> +<ppg_esp32.ino.cpp>
; No third-party libraries: sensor_drivers.h talks to the MAX30102 / ADXL345 with Wire only.

; ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM) - pins: SDA 8, SCL 9 (see config.h)
[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; classic ESP32 DevKit - pins: SDA 22, SCL 23 (old wiring, see config.h)
[env:esp32dev]
platform = espressif32
board = esp32dev

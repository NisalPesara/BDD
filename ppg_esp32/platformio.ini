; Optional PlatformIO setup for ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM).
; Put the .ino content in src/main.cpp (add #include <Arduino.h>) and the .h files in src/.
[env:esp32-s3-n16r8]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi    ; octal PSRAM (N16R8)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 460800
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
    adafruit/Adafruit MPU6050
    adafruit/Adafruit ADXL345
    adafruit/Adafruit Unified Sensor

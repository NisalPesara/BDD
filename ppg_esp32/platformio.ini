; Optional PlatformIO setup (Arduino IDE users: just open ppg_esp32.ino).
; The sketch folder itself is the source folder; test/ and tools/ are excluded from the firmware build.
[platformio]
src_dir = .
default_envs = esp32dev   ; matches the current wiring in config.h (SDA 22, SCL 23)

[env]
framework = arduino
monitor_speed = 460800
build_src_filter = -<*> +<ppg_esp32.ino> +<ppg_esp32.ino.cpp>
; No third-party libraries: sensor_drivers.h talks to the MAX30102 / ADXL345 with Wire only.

; ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM) - pins: SDA 8, SCL 9 (see config.h)
[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; classic ESP32 DevKit - pins: SDA 22, SCL 23 (old wiring, see config.h)
[env:esp32dev]
platform = espressif32
board = esp32dev

; I2C wiring diagnostic (tools/i2c_diag): pio run -e i2c_diag -t upload, then reflash the firmware
[env:i2c_diag]
platform = espressif32
board = esp32dev
build_src_filter = -<*> +<tools/i2c_diag/i2c_diag.cpp>

; Wire finder (tools/wire_finder): pull-up check + bit-banged I2C scan on every pin pair, then reflash
[env:wire_finder]
platform = espressif32
board = esp32dev
build_src_filter = -<*> +<tools/wire_finder/wire_finder.cpp>

; MAX30102 ADC-range / LED-current A-B test (tools/light_test): pio run -e light_test -t upload, then reflash
[env:light_test]
platform = espressif32
board = esp32dev
build_src_filter = -<*> +<tools/light_test/light_test.cpp>
